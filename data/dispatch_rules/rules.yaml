- rule_id: chat_normal
  name: 群聊AI对话
  description: 群聊中使用 /chat 开头对话或者 被@ 时触发聊天
  workflow_id: chat:normal
  priority: 5
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: prefix
      config:
        prefix: /chat
    - type: bot_mention
      config: {}
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 群聊
  metadata:
    category: chat
    permission: user
    temperature: 0.7
- rule_id: chat_creative
  name: 私聊AI对话
  description: 私聊时直接发送内容触发对话
  workflow_id: chat:normal
  priority: 5
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 私聊
  metadata:
    category: chat
    permission: user
    temperature: 0.9
- rule_id: chat_alei_song
  name: 雷帝点歌
  description: 玩家发送“阿雷歌曲”时随机播放语音
  workflow_id: chat:alei_song
  priority: 15
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: regex
      config:
        pattern: ^阿雷歌曲$
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 群聊
  metadata:
    category: chat
    permission: user
- rule_id: chat_alei_song_full
  name: 雷帝点歌（完整版）
  description: 玩家发送“完整阿雷歌曲”时随机播放完整版语音
  workflow_id: chat:alei_song_full
  priority: 25
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: keyword
      config:
        keywords:
        - 完整阿雷歌曲
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 群聊
  metadata:
    category: chat
    permission: user
- rule_id: chat_alei_song_catalog
  name: 雷帝点歌目录
  description: 返回阿雷歌曲列表
  workflow_id: chat:alei_song_catalog
  priority: 20
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: keyword
      config:
        keywords:
        - 阿雷歌曲目录
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 群聊
  metadata:
    category: chat
    permission: user
- rule_id: chat_alei_song_request
  name: 雷帝点歌（指定歌曲）
  description: 解析“点歌：歌名”并播放对应歌曲
  workflow_id: chat:alei_song_request
  priority: 20
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: regex
      config:
        pattern: ^点歌[:：].+
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 群聊
  metadata:
    category: chat
    permission: user
- rule_id: game_dice
  name: 骰子
  description: 骰子游戏，支持 XdY 格式
  workflow_id: game:dice
  priority: 5
  enabled: false
  rule_groups:
  - operator: or
    rules:
    - type: regex
      config:
        pattern: ^[.。]roll\s*(\d+)?d(\d+)
  metadata: {}
- rule_id: game_gacha
  name: 抽卡
  description: 抽卡模拟器
  workflow_id: game:gacha
  priority: 5
  enabled: false
  rule_groups:
  - operator: or
    rules:
    - type: keyword
      config:
        keywords:
        - 抽卡
        - 十连
        - 单抽
  metadata: {}
- rule_id: history_search
  name: 智能历史记录搜索
  description: 当用户要求查询历史记录时触发 (关键词+向量融合)
  workflow_id: chat:smart_search
  priority: 15
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: chat_type
      config:
        chat_type: 群聊
    - type: chat_type
      config:
        chat_type: 私聊
  - operator: or
    rules:
    - type: keyword
      config:
        keywords:
        - 找一下
        - 查一下
        - 搜一下
        - 看一下
        - 找找
        - 查查
        - 搜搜
        - 看看
        - 回顾
        - 翻翻
        - 历史
        - 记录
        - 上次
        - 之前
        - 以前
        - 之前说
        - 上次说
        - 你记得
        - 记得吗
        - 还记得
        - 你知道
        - 知道吗
        - 有没有说过
        - 说过吗
        - 聊过
        - 聊了
        - 讨论过
        - 提到过
        - 是谁
        - 是什么
        - 在哪里
        - 谁
        - 哪个
        - 什么
        - 哪
        - 如何
        - 评价
        - 刚刚
        - 为何
  metadata:
    category: chat
    permission: user
- rule_id: system_help
  name: 帮助命令
  description: 显示帮助信息
  workflow_id: system:help
  priority: 10
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: prefix
      config:
        prefix: /help
  metadata:
    category: system
    permission: user
- rule_id: system_clear_memory
  name: 清空记忆
  description: 清空当前对话的记忆
  workflow_id: system:clear_memory
  priority: 10
  enabled: false
  rule_groups:
  - operator: or
    rules:
    - type: prefix
      config:
        prefix: /清空记忆
  metadata:
    category: system
    permission: user
- rule_id: fallback
  name: 默认规则
  description: 当上述规则均没有匹配成功时，执行此工作流。
  workflow_id: chat:memory_store
  priority: 0
  enabled: true
  rule_groups:
  - operator: or
    rules:
    - type: fallback
      config: {}
  metadata: {}
