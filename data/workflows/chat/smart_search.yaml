                {memory_content}
                -- 对话记录结束 --

                请注意，下面这些符号只是标记：
                1. `<break>` 用于表示聊天时发送消息的操作。
                2. `<@llm>` 开头的内容表示你当前扮演角色的回答，你的回答中不能带上这个标记。

                接下来，请基于以上的信息，与用户继续扮演角色。
                """
            ).strip()

            search_section = textwrap.dedent(
                f"""
                # Search Results
                {search_context}

                # 用户询问
