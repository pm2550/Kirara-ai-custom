- type: internal:code
  name: prepare_summary_context
  params:
    code: |
      from collections import deque

      MAX_CONTEXT_LINES = 40

      def _clean_text(text):
          return " ".join((text or "").replace("<break>", " ").replace("\n", " ").split())

      def execute(user_msg, memory_entries):
          context_lines = deque(maxlen=MAX_CONTEXT_LINES)

          sender = getattr(user_msg, "sender", None)
          display_name = getattr(sender, "display_name", "") or "用户"
          user_text = getattr(user_msg, "content", "") or ""
          normalized_current = _clean_text(user_text)
          if normalized_current:
              context_lines.append(f"{display_name}: {normalized_current}")

          for entry in reversed(list(memory_entries or [])):
              try:
                  entry_text = str(entry).strip()
              except Exception:
                  continue
              if not entry_text:
                  continue

              parts = entry_text.split("你回答:")
              user_part = _clean_text(parts[0]) if parts else ""
              bot_part = _clean_text(parts[1]) if len(parts) > 1 else ""

              if user_part:
                  context_lines.append(user_part)
              if bot_part:
                  context_lines.append(f"雷帝: {bot_part}")

              if len(context_lines) >= context_lines.maxlen:
                  break

          context_list = list(context_lines)
          if context_list:
              summary_prompt = "请根据以下对话生成一条简洁的检索查询：\n" + "\n".join(context_list)
          else:
              summary_prompt = normalized_current or "请返回一个检索关键词。"

          return {
              "summary_prompt": summary_prompt,
              "normalized_current": normalized_current,
          }
    inputs:
    - name: user_msg
      label: 当前消息
    - name: memory_entries
      label: 最近对话
    outputs:
    - name: summary_prompt
      label: 摘要提示
    - name: normalized_current
      label: 当前文本
  position:
    x: 260
    y: 540
  connected_to:
  - target: summary_message_constructor
    mapping:
      from: summary_prompt
      to: user_prompt_format
