      from: recent_count
      to: recent_count
- type: internal:code
  name: extract_query
  params:
    code: |
      from collections import deque

      def execute(user_msg, summary_query, context_entries):
          user_text = getattr(user_msg, "content", str(user_msg) or "").strip()
          normalized_text = user_text.replace("<break>", " ").replace("\n", " ").strip()
          normalized_text = " ".join(normalized_text.split())

          sender = getattr(user_msg, "sender", None)
          display_name = getattr(sender, "display_name", "")

          context_snippets = deque(maxlen=3)
          for entry in reversed(list(context_entries or [])):
              try:
                  entry_text = str(entry).strip()
              except Exception:
                  continue
              if not entry_text:
                  continue
              parts = entry_text.split("你回答:")
              user_part = parts[0].strip()
              if display_name and user_part.startswith(display_name):
                  user_content = user_part.split("说:", 1)[-1].strip()
                  user_content = user_content.replace("<break>", " ").replace("\n", " ")
                  user_content = " ".join(user_content.split())
                  if user_content:
                      context_snippets.appendleft(user_content)

          combined_context = " ".join(list(context_snippets) + [normalized_text])
          combined_context = " ".join(combined_context.split())

          summary_text = (summary_query or "").replace("<break>", " ").strip()
          summary_text = " ".join(summary_text.split())

          queries = []
          if summary_text and summary_text.lower() not in {"none", "null"}:
              queries.append(summary_text)
          if combined_context:
              queries.append(combined_context)

          final_query = " ".join(queries).strip()
          if not final_query:
              final_query = normalized_text

          return {
              "search_query": final_query,
              "original_query": normalized_text,
              "summary_query": summary_text,
          }
    inputs:
    - name: user_msg
      label: 用户消息
    - name: summary_query
      label: 摘要查询
    - name: context_entries
      label: 最近上下文
    outputs:
    - name: search_query
      label: 搜索关键词
    - name: original_query
      label: 原始查询
    - name: summary_query
      label: 摘要查询
  position:
    x: 250
    y: 300
  connected_to:
  - target: recent_history_search
    mapping:
      from: search_query
      to: search_query
  - target: keyword_search
    mapping:
      from: search_query
      to: query
  - target: vector_search
    mapping:
      from: search_query
      to: query
- type: internal:code
  name: keyword_search
  params:
    code: |
      import json
      import os
      from datetime import datetime, timedelta

      def execute(query, chat_sender, recent_count):
          if recent_count and recent_count > 0:
              return {
                  "keyword_results": [],
                  "keyword_count": 0
              }

          # 全局扫描 memory 目录（群聊与私聊都搜）
          memory_dir = "data/memory"
          results = []
          bot_results = []
        group_id = getattr(chat_sender, "group_id", None) if chat_sender else None
        if group_id is not None:
            group_id = str(group_id)
          if group_id is not None:
              group_id = str(group_id)
          if os.path.exists(memory_dir):
              time_range_start = datetime.now() - timedelta(days=30)
              for name in os.listdir(memory_dir):
                  if not (name.startswith("group_") or name.startswith("c2c_") or name.startswith("member_")):
                      continue
                  if group_id:
                      if name.startswith("group_") and name != f"group_{group_id}.json":
                          continue
                      if name.startswith("member_") and not name.startswith(f"member_{group_id}_"):
                          continue
                      if name.startswith("c2c_"):
                          continue
                  if name.endswith("_summary.json"):
                      continue
                  file_path = os.path.join(memory_dir, name)
                  try:
                      with open(file_path, "r", encoding="utf-8") as f:
                          all_entries = json.load(f)
                      for entry in all_entries:
                          entry_timestamp = datetime.fromisoformat(entry.get("timestamp", datetime.now().isoformat()))
                          if entry_timestamp < time_range_start:
                              continue
                          content = entry.get("content", "") or ""
                          parts = content.split("你回答:")
                          user_content = parts[0].strip()
                          bot_content = parts[1].strip() if len(parts) > 1 else ""
                          sender_name = entry.get("sender", {}).get("display_name", "")

                          if query:
                              lowered = query.lower()
                              if user_content and (lowered in user_content.lower() or lowered in sender_name.lower()):
                                  results.append({
                                      "content": user_content,
                                      "user_name": sender_name,
                                      "timestamp": entry.get("timestamp", ""),
                                      "source": "keyword",
                                      "is_bot": False
                                  })
                              if bot_content and lowered in bot_content.lower():
                                  bot_results.append({
                                      "content": bot_content,
                                      "user_name": "雷帝",
                                      "timestamp": entry.get("timestamp", ""),
                                      "source": "keyword",
                                      "is_bot": True
                                  })
                  except Exception:
                      continue

          results.sort(key=lambda r: r.get("timestamp", ""), reverse=True)
          bot_results.sort(key=lambda r: r.get("timestamp", ""), reverse=True)
          combined = results + bot_results

          return {
              "keyword_results": combined,
              "keyword_count": len(results)
          }
    inputs:
    - name: query
      label: 查询关键词
    - name: chat_sender
      label: 发送者信息
    - name: recent_count
      label: 最近匹配数量
    outputs:
    - name: keyword_results
      label: 关键词搜索结果
    - name: keyword_count
      label: 结果数量
  position:
    x: 450
    y: 200
  connected_to:
  - target: merge_results
    mapping:
      from: keyword_results
      to: keyword_results
  - target: merge_results
    mapping:
      from: keyword_count
      to: keyword_count
- type: internal:code
  name: vector_search
  params:
    code: "import sys\nimport os\n\ndef execute(query, chat_sender, recent_count):\n    if recent_count and recent_count > 0:\n        return {\n            \"vector_results\": []\n        }\n\n    try:\n        # 添加项目根目录到 Python 路径\n        project_root = os.path.abspath(os.path.join(os.getcwd()))\n        if project_root not in sys.path:\n            sys.path.insert(0, project_root)\n        \n        from vector_memory import get_vector_manager\n        \n        vector_manager = get_vector_manager()\n        \n        group_id = getattr(chat_sender, \"group_id\", None) if chat_sender else None\n        # 向量搜索（按群过滤，若无群号则全局）\n        vector_results = vector_manager.search(\n            query=query,\n            n_results=10,\n            group_filter=group_id\n        )\n        \n        # 格式化结果\n        formatted_results = []\n        for r in vector_results:\n            user_name = r.get(\"user_name\", \"\")\n            is_bot = user_name in {\"雷帝\", \"隐秘的阿雷\", \"雷猪猪\"}\n            formatted_results.append({\n                \"content\": r[\"content\"],\n                \"user_name\": r[\"user_name\"],\n                \"timestamp\": r[\"timestamp\"],\n                \"similarity\": 1 - r[\"distance\"],\n                \"source\": \"vector\",\n                \"is_bot\": is_bot\n            })\n        \n        return {\n            \"vector_results\": formatted_results\n        }\n    except Exception as e:\n        print(f\"Vector search error: {e}\")\n        return {\n            \"vector_results\": []\n        }\n"
    inputs:
    - name: query
      label: 查询关键词
    - name: chat_sender
      label: 发送者信息
    - name: recent_count
      label: 最近匹配数量
    outputs:
    - name: vector_results
      label: 向量搜索结果
  position:
    x: 450
    y: 400
  connected_to:
  - target: merge_results
    mapping:
      from: vector_results
      to: vector_results
- type: internal:code
  name: merge_results
  params:
    code: |
      def execute(recent_results, recent_count, keyword_results, keyword_count, vector_results):
          recent_results = recent_results or []
          keyword_results = keyword_results or []
          vector_results = vector_results or []
          recent_count = recent_count or 0
          keyword_count = keyword_count or 0

          def split_bot(items):
              user_items = []
              bot_items = []
              for item in items:
                  if item.get("is_bot"):
                      bot_items.append(item)
                  else:
                      user_items.append(item)
              return user_items, bot_items

          def dedup_append(target, source, seen, limit=30):
              for entry in source:
                  if len(target) >= limit:
                      break
                  key = (entry.get("content"), entry.get("timestamp"), entry.get("is_bot", False))
                  if key in seen:
                      continue
                  seen.add(key)
                  target.append(entry)

          recent_user, recent_bot = split_bot(recent_results)
          keyword_user, keyword_bot = split_bot(keyword_results)
          vector_user, vector_bot = split_bot(vector_results)

          final_results = []
          search_method = "没有结果"
          seen = set()

          if recent_count > 0:
              dedup_append(final_results, recent_user, seen)
              dedup_append(final_results, recent_bot, seen)
              search_method = "最近对话"
          elif keyword_count >= 3 and keyword_user:
              dedup_append(final_results, keyword_user, seen)
              dedup_append(final_results, keyword_bot, seen)
              search_method = "关键词搜索"
          else:
              search_method = "向量搜索"
              dedup_append(final_results, keyword_user, seen)
              if keyword_count > 0 and final_results:
                  search_method = f"关键词({keyword_count}条)"
              elif keyword_count > 0:
                  search_method = f"关键词({keyword_count}条)"

              dedup_append(final_results, vector_user, seen)

              if len(final_results) < 5:
                  dedup_append(final_results, keyword_bot, seen)
              if len(final_results) < 30:
                  dedup_append(final_results, vector_bot, seen)

              if keyword_count > 0 and any(r.get("source") == "vector" for r in final_results):
                  search_method = f"关键词({keyword_count}条) + 向量补充"

          final_results = final_results[:30]

          if final_results:
              context = f"📊 搜索方式: {search_method}\n\n"
              context += "找到以下相关记录:\n\n"
              for i, r in enumerate(final_results, 1):
                  source = r.get("source")
                  if source == "keyword":
                      source_icon = "��"
                  elif source == "vector":
                      source_icon = "🧠"
                  elif source == "recent":
                      source_icon = "🕒"
                  else:
                      source_icon = "📄"
                  similarity_text = ""
                  if "similarity" in r and isinstance(r.get("similarity"), (int, float)):
                      similarity_text = f" (相似度: {r['similarity']:.0%})"
                  context += f"{i}. {source_icon} [{r.get('user_name', '匿名')}]: {r.get('content', '')}{similarity_text}\n"
                  timestamp = r.get('timestamp', '') or ''
                  context += f"   时间: {timestamp[:19]}\n\n"
          else:
              context = "没有找到相关记录。"

          return {
              "search_context": context,
              "result_count": len(final_results)
          }
    inputs:
    - name: recent_results
      label: 最近匹配结果
    - name: recent_count
      label: 最近匹配数量
    - name: keyword_results
      label: 关键词结果
    - name: keyword_count
      label: 关键词结果数
    - name: vector_results
      label: 向量结果
    outputs:
    - name: search_context
      label: 搜索上下文
    - name: result_count
      label: 结果总数
