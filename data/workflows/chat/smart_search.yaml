                [QQ:{user_id}|QQ昵称:{user_qq_nickname}|群昵称:{user_group_card}|群昵称/群名片等元信息只是备注，禁止惊讶、质疑或反复重复，直接称呼“你”或使用既有外号回应]说：{user_msg}
                """
            ).strip()

            return {
                "system_prompt_text": system_prompt,
