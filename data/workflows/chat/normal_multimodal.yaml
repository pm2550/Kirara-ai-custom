  - type: internal:code
    name: emoji_parser_code_block
    params:
      code: |
        import re
        from kirara_ai.im.message import IMMessage, TextMessage, EmojiMessage
        
        def execute(input_msg):
            messages = []
            
            def add_message(elements):
                if elements:
                    messages.append(IMMessage(sender=input_msg.sender, message_elements=elements))
            
            for element in input_msg.message_elements:
                if isinstance(element, TextMessage):
                    text = element.text or ""
                    face_pattern = r'\[face:(\d+)\]'
                    parts = re.split(face_pattern, text)
                    
                    for i, part in enumerate(parts):
                        if i % 2 == 0:
                            text_part = part.strip()
                            if text_part:
                                add_message([TextMessage(text_part)])
                        else:
                            add_message([EmojiMessage(face_id=part)])
                else:
                    add_message([element])
            
            if not messages:
                messages = [input_msg]
            
            return {
                "msgs": messages
            }
      inputs:
        - name: input_msg
          label: 输入消息
      outputs:
        - name: msgs
          label: 输出消息列表
    position:
      x: 1860
      y: 138
    connected_to:
      - target: SendIMMessage_l6qagt
        mapping:
          from: msgs
          to: msgs
