name: 聊天 - 原生多模态对话
description: 基于原生多模态能力的图文对话，适用于本身支持图片输入/回答的模型，在读取记忆时会恢复原来的媒体资源
blocks:
  - type: internal:get_message
    name: get_message
    params: {}
    position:
      x: 100
      y: 138
    connected_to:
      - target: ToggleEditState_i24m23
        mapping:
          from: sender
          to: sender
      - target: ToggleEditState_i24m23
        mapping:
          from: sender
          to: sender
      - target: query_memory
        mapping:
          from: sender
          to: chat_sender
      - target: ChatMessageConstructor_6c185s
        mapping:
          from: msg
          to: user_msg
      - target: ChatMemoryStore_tapuo1
        mapping:
          from: msg
          to: user_msg
  - type: internal:toggle_edit_state
