        以下是之前发生过的对话记录。
        -- 对话记录开始 --
        {memory_content}
        -- 对话记录结束 --

        请注意，下面这些符号只是标记：
        1. `<break>` 用于表示聊天时发送消息的操作。

        接下来，请基于以上的信息，与用户继续扮演角色。
