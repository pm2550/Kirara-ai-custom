id: chat:alei_song_full
name: 雷帝点歌 - 完整随机
description: 玩家发送“完整阿雷歌曲”时，从完整版语音中随机挑选一段播放。
version: '1.0'
blocks:
- type: internal:get_message
  name: get_message
  params: {}
  position:
    x: 100
    y: 200
  connected_to:
  - target: pick_full_clip
    mapping:
      from: sender
      to: chat_sender
- type: internal:code
  name: pick_full_clip
  params:
    code: "import random\nimport pathlib\nfrom kirara_ai.im.message import IMMessage,\
      \ VoiceMessage, TextMessage\nfrom kirara_ai.im.sender import ChatSender\n\n\
      def _resolve_media_path(*parts):\n    project_media = pathlib.Path.cwd() / \"\
      media\"\n    if project_media.exists():\n        return (project_media / pathlib.Path(*parts)).resolve()\n\
      \n    try:\n        current = pathlib.Path(__file__).resolve()\n    except NameError:\n\
      \        current = pathlib.Path.cwd()\n\n    for parent in [current, *current.parents]:\n\
      \        media_root = parent / \"media\"\n        if media_root.exists():\n\
      \            return (media_root / pathlib.Path(*parts)).resolve()\n\n    return\
      \ (project_media / pathlib.Path(*parts)).resolve()\n\ndef execute(chat_sender):\n\
      \    clips_dir = _resolve_media_path(\"silk_full\")\n    if not clips_dir.exists():\n\
      \        raise FileNotFoundError(f\"完整版语音目录不存在: {clips_dir}\")\n\n    clips\
      \ = [p for p in clips_dir.glob(\"*.silk\") if p.is_file()]\n    if not clips:\n\
      \        raise FileNotFoundError(f\"完整版语音目录 {clips_dir} 下没有 silk 文件\")\n\n \
      \   selected = random.choice(clips)\n    voice_element = VoiceMessage(path=str(selected),\
      \ format=\"silk\")\n    message = IMMessage(\n        sender=ChatSender.get_bot_sender(),\n\
      \        message_elements=[voice_element]\n    )\n\n    return {\n        \"\
      msgs\": [message],\n        \"target\": chat_sender,\n        \"selected_clip\"\
      : str(selected)\n    }\n"
    inputs:
    - name: chat_sender
      label: 目标
    outputs:
    - name: msgs
      label: 语音消息
    - name: target
      label: 目标
    - name: selected_clip
      label: 已选择语音
  position:
    x: 320
    y: 200
  connected_to:
  - target: msg_sender
    mapping:
      from: msgs
      to: msgs
  - target: msg_sender
    mapping:
      from: target
      to: target
- type: internal:send_message_batch
  name: msg_sender
  params: {}
  position:
    x: 560
    y: 200
