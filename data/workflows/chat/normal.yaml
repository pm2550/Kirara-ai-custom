- type: internal:code
  name: prepare_ocr_prompt
  params:
    code: |
      def execute(image_urls, user_text):
          image_urls = image_urls or []
          if not image_urls:
              return {
                  "ocr_user_prompt": "",
                  "user_text": user_text or "",
              }

          lines = [f"{idx+1}. {url}" for idx, url in enumerate(image_urls[:4])]
          prompt = (
            "请阅读以下图片（URL可访问），提取图片文字；若无文字则简要描述主要内容。"
            "每张图片不超过50字，按序号逐条输出，最多4张。\n"
            "图片列表:\n" + "\n".join(lines)
          )

          return {
              "ocr_user_prompt": prompt,
              "user_text": user_text or "",
          }
    inputs:
    - name: image_urls
      label: 图片URL列表
    - name: user_text
      label: 用户文本
    outputs:
    - name: ocr_user_prompt
      label: OCR用户提示
    - name: user_text
      label: 用户文本透传
  position:
    x: 360
    y: 360
  connected_to:
  - target: ocr_message_constructor
    mapping:
      from: ocr_user_prompt
      to: user_prompt_format
  - target: merge_user_text
    mapping:
      from: user_text
      to: user_text

