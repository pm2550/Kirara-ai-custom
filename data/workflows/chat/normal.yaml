- type: internal:code
  name: emoji_parser_code_block
  params:
    code: "import re\nfrom kirara_ai.im.message import IMMessage, TextMessage, EmojiMessage\n\
      from kirara_ai.im.sender import ChatSender\n\ndef execute(llm_text):\n    llm_text\
      \ = (llm_text or \"\").replace(\"<@llm>\", \"\").replace(\"\\r\\n\", \"<break>\"\
      ).replace(\"\\n\", \"<break>\")\n    messages = []\n\n    segments = llm_text.split(\"\
      <break>\")\n\n    for segment in segments:\n        segment = segment.strip()\n\
      \        if not segment:\n            continue\n\n        elements = []\n  \
      \      face_pattern = r'\\[face:(\\d+)\\]'\n        parts = re.split(face_pattern,\
      \ segment)\n\n        for i, part in enumerate(parts):\n            if i % 2\
      \ == 0:\n                text = part.strip()\n                if text:\n   \
      \                 elements.append(TextMessage(text))\n            else:\n  \
      \              elements.append(EmojiMessage(face_id=part))\n\n        if elements:\n\
      \            messages.append(\n                IMMessage(\n                \
      \    sender=ChatSender.get_bot_sender(),\n                    message_elements=elements\n\
      \                )\n            )\n\n    if not messages:\n        messages\
      \ = [\n            IMMessage(\n                sender=ChatSender.get_bot_sender(),\n\
      \                message_elements=[TextMessage(llm_text.strip())]\n        \
      \    )\n        ]\n\n    return {\n        \"msgs\": messages\n    }\n"
    inputs:
    - name: llm_text
      label: LLM文本
    outputs:
    - name: msgs
      label: IM消息列表
  position:
    x: 1918
    y: 347
  connected_to:
  - target: msg_sender_lakgf8
    mapping:
      from: msgs
      to: msgs
