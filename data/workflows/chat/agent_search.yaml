  params:
    scope_type: group
  position:
    x: 1850
    y: 450

- type: internal:llm_response_to_text
  name: response_converter
  params: {}
  position:
    x: 1850
    y: 300
  connected_to:
  - target: emoji_parser
    mapping:
      from: text
      to: llm_text

- type: internal:code
  name: emoji_parser
  params:
    code: |
      import re
      from kirara_ai.im.message import IMMessage, TextMessage, EmojiMessage
      from kirara_ai.im.sender import ChatSender

      def execute(llm_text):
          llm_text = (llm_text or "").replace("<@llm>", "").replace("\n", "<break>").replace("<br>", "<break>").replace("<br/>", "<break>").replace("\r", "<break>")
          messages = []
          segments = llm_text.split("<break>")

          for segment in segments:
              segment = segment.strip()
              if not segment:
                  continue

              elements = []
              face_pattern = r'\[face:(\d+)\]'
              parts = re.split(face_pattern, segment)

              for i, part in enumerate(parts):
                  if i % 2 == 0:
                      text = part.strip()
                      if text:
                          elements.append(TextMessage(text))
                  else:
                      elements.append(EmojiMessage(face_id=part))

              if elements:
                  messages.append(
                      IMMessage(
                          sender=ChatSender.get_bot_sender(),
                          message_elements=elements
                      )
                  )

          if not messages:
              messages = [
                  IMMessage(
                      sender=ChatSender.get_bot_sender(),
                      message_elements=[TextMessage(llm_text.strip())]
                  )
              ]

          return {
              "msgs": messages
          }
    inputs:
    - name: llm_text
      label: LLM文本
    outputs:
    - name: msgs
      label: IM消息列表
  position:
    x: 2050
    y: 300
  connected_to:
  - target: msg_sender_batch
    mapping:
      from: msgs
      to: msgs

- type: internal:send_message_batch
  name: msg_sender_batch
  params: {}
  position:
    x: 2250
    y: 300
