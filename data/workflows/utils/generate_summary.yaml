name: 生成历史摘要
description: 对历史对话生成压缩摘要（手动触发）
blocks:
- type: internal:code
  name: load_and_prepare
  params:
    code: |
      import json
      import os
      from pathlib import Path
      
      def execute():
          """扫描所有 memory 文件，找出需要生成摘要的"""
          memory_dir = Path("./data/memory")
          tasks = []
          
          for file_path in memory_dir.glob("*.json"):
              if "_summary" in file_path.name:
                  continue
              
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      entries = json.load(f)
                  
                  if len(entries) > 60:
                      scope_key = file_path.stem
                      # 检查是否已有摘要
                      summary_path = memory_dir / f"{scope_key}_summary.json"
                      if summary_path.exists():
                          with open(summary_path, 'r', encoding='utf-8') as f:
                              summary_data = json.load(f)
                          old_count = summary_data.get("entry_count", 0)
                          # 新增不到 20 条，跳过
                          if len(entries) - old_count < 20:
                              continue
                      
                      tasks.append({
                          "scope_key": scope_key,
                          "entry_count": len(entries),
                          "file_path": str(file_path)
                      })
              except Exception as e:
                  print(f"Error loading {file_path}: {e}")
                  continue
          
          return {
              "tasks": tasks,
              "task_count": len(tasks)
          }
    inputs: []
    outputs:
    - name: tasks
      label: 待处理任务列表
    - name: task_count
      label: 任务数量
  position:
    x: 100
    y: 100

- type: internal:code
  name: process_task
  params:
    code: |
      import json
      from pathlib import Path
      
      def execute(tasks):
          """处理第一个任务"""
          if not tasks:
              return {
                  "has_task": False,
                  "scope_key": "",
                  "old_content": "",
                  "entry_count": 0
              }
          
          task = tasks[0]
          file_path = Path(task["file_path"])
          
          with open(file_path, 'r', encoding='utf-8') as f:
              entries = json.load(f)
          
          # 取前 40 条用于生成摘要
          old_entries = entries[:min(40, len(entries) - 20)]
          
          lines = []
          for entry in old_entries:
              content = entry.get("content", "")
              if content:
                  lines.append(content)
          
          return {
              "has_task": True,
              "scope_key": task["scope_key"],
              "old_content": "\n\n".join(lines),
              "entry_count": len(old_entries)
          }
    inputs:
    - name: tasks
      label: 任务列表
    outputs:
    - name: has_task
      label: 是否有任务
    - name: scope_key
      label: 作用域键
    - name: old_content
      label: 旧对话内容
    - name: entry_count
      label: 条目数量
  position:
    x: 300
    y: 100
  connected_to:
  - target: summary_user_prompt
    mapping:
      from: old_content
      to: old_content

- type: internal:text_block
  name: summary_system_prompt
  params:
    text: |
      你是一个对话历史摘要助手。请阅读用户提供的历史对话记录，生成一份简洁的摘要。
      
      要求：
      1. 总结关键话题、重要信息和情感基调
      2. 保留人物关系、重要事实和时间线
      3. 控制在 200 字以内
      4. 使用第三人称客观描述
      5. 按时间或话题分段
      6. 不要添加自己的评论或解释
      7. 保留对理解上下文重要的细节
  position:
    x: 500
    y: 100
  connected_to:
  - target: summary_constructor
    mapping:
      from: text
      to: system_prompt_format

- type: internal:code
  name: summary_user_prompt
  params:
    code: |
      def execute(old_content):
          # 仅传递纯历史内容，不再额外添加提示语
          return {"user_prompt": old_content[:2000]}
    inputs:
    - name: old_content
      label: 对话内容
    outputs:
    - name: user_prompt
      label: 用户提示
  position:
    x: 500
    y: 200
  connected_to:
  - target: summary_constructor
    mapping:
      from: user_prompt
      to: user_prompt_format

- type: internal:chat_message_constructor
  name: summary_constructor
  params: {}
  position:
    x: 700
    y: 150
  connected_to:
  - target: llm_summary
    mapping:
      from: llm_msg
      to: prompt

- type: internal:chat_completion
  name: llm_summary
  params:
    model_name: deepseek-chat
    temperature: 0.3
  position:
    x: 900
    y: 150
  connected_to:
  - target: extract_summary
    mapping:
      from: resp
      to: response

- type: internal:llm_response_to_text
  name: extract_summary
  params: {}
  position:
    x: 1100
    y: 150
  connected_to:
  - target: save_summary
    mapping:
      from: text
      to: summary_text

- type: internal:code
  name: save_summary
  params:
    code: |
      import json
      from pathlib import Path
      from datetime import datetime
      
      def execute(scope_key, summary_text, entry_count):
          """保存摘要到文件"""
          if not scope_key:
              return {"saved": False}
          
          summary_path = Path(f"./data/memory/{scope_key}_summary.json")
          data = {
              "summary": summary_text.strip(),
              "entry_count": entry_count,
              "generated_at": datetime.now().isoformat(),
          }
          
          with open(summary_path, 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          
          return {
              "saved": True,
              "path": str(summary_path)
          }
    inputs:
    - name: scope_key
      label: 作用域键
    - name: summary_text
      label: 摘要文本
    - name: entry_count
      label: 条目数量
    outputs:
    - name: saved
      label: 是否保存成功
    - name: path
      label: 保存路径
  position:
    x: 1300
    y: 150
